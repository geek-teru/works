version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ${AMPLIFY_MONOREPO_APP_ROOT}
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/* 