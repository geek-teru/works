openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: API for managing users and tasks

paths:
  /users:
    get:
      summary: List users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/user.yaml#/User'

    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/user.yaml#/UserInput'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/User'

  /users/{userId}:
    get:
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/User'

    put:
      summary: Update user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/user.yaml#/UserInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/User'

    delete:
      summary: Delete user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No content

  /tasks:
    get:
      summary: List tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/task.yaml#/Task'

    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/task.yaml#/TaskInput'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: './components/schemas/task.yaml#/Task'

  /tasks/{taskId}:
    get:
      summary: Get task by ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: './components/schemas/task.yaml#/Task'

    put:
      summary: Update task by ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/task.yaml#/TaskInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: './components/schemas/task.yaml#/Task'

    delete:
      summary: Delete task by ID
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No content
